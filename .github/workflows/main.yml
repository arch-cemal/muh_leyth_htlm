name: Build HTML to Windows EXE (Electron)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Initialize Electron App Config
      run: |
        # سيقوم السيرفر بتهيئة ملف الإعدادات وضبط الأوامر برمجياً لضمان الاستقرار
        $packageJson = @{
            name = "html-windows-app"
            version = "1.0.0"
            main = "main.js"
            scripts = @{
                package = "electron-builder --win --x64"
            }
        } | ConvertTo-Json
        Set-Content -Path package.json -Value $packageJson -Encoding UTF8

        # توليد ملف تشغيل النافذة الذكي تلقائياً لفتح واجهتك
        $mainJs = @'
        const { app, BrowserWindow } = require('electron')
        const path = require('path')

        function createWindow () {
          const win = new BrowserWindow({
            width: 1100,
            height: 750,
            autoHideMenuBar: true,
            webPreferences: {
              nodeIntegration: true
            }
          })
          win.loadFile('index.html')
        }

        app.whenReady().then(() => {
          createWindow()
          app.on('activate', () => {
            if (BrowserWindow.getAllWindows().length === 0) createWindow()
          })
        })

        app.on('window-all-closed', () => {
          if (process.platform !== 'darwin') app.quit()
        })
        '@
        Set-Content -Path main.js -Value $mainJs -Encoding UTF8

    - name: Install Electron and Builder
      run: |
        npm install electron --save-dev
        npm install electron-builder --save-dev

    - name: Build Production EXE Package
      run: |
        npm run package

    - name: Upload Windows Application Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Electron-Windows-Application
        path: dist/*.exe
