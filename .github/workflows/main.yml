name: Build HTML to Windows EXE

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js Environment
      uses: actions/setup-node@v4
      with:
        node-version: '18'

    - name: Initialize Project Package
      run: |
        if (-not (Test-Path package.json)) {
          '{"name": "html-app", "main": "index.html", "window": {"title": "Application", "width": 1000, "height": 700, "toolbar": false}}' | Out-File -Encoding utf8 package.json
        }

    - name: Install NW.js Builder Locally
      run: |
        npm install nwjs-builder-phoenix

    - name: Build Windows Executable Using npx
      run: |
        # استخدام npx يضمن تشغيل الأداة مباشرة بدون مشاكل مسارات الوندوز
        npx nwbuild --platforms win64 --outputDir dist/ .

    - name: Upload Windows Application Artifact
      uses: actions/upload-artifact@v4
      with:
        name: HTML-Windows-Application
        path: dist/
